<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#151312" />
    <link rel="preload" href="/src/assets/fonts/CinekZieluAbstract-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="google-site-verification" content="I1bGi2_neE_50vyYSQgHT5O4ml9T5vO2JmAADP0HhGY" />
    <script>
      // Hide only the first intro until React prepares its initial frame.
      // No-JS and repeat visits retain the complete prerendered SVG.
      try {
        if (location.pathname === '/' && !sessionStorage.getItem('cz.hero-logo.v2') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.setAttribute('data-cz-logo-pending', '')
          setTimeout(function () { document.documentElement.removeAttribute('data-cz-logo-pending') }, 5000)
        }
      } catch (_) {}
    </script>
    <!-- site-metadata:start -->
    <title>Cinek Zielu | Góry, podróże i film</title>
    <meta name="description" content="Marcin Zieliński — fotografie i filmy z gór i podróży. Odkryj wyprawy, galerie i miejsca na mapie." />
    <link rel="canonical" href="https://www.cinekzielu.pl/" />
    <!-- site-metadata:end -->
  </head>
  <body>
    <div id="root"></div>
    <noscript><p>Treści i fotografie są dostępne poniżej. Włącz JavaScript, aby używać interaktywnej mapy, filtrów i powiększania zdjęć. Filmy znajdziesz także na <a href="https://www.youtube.com/@cinek_zielu">kanale Cinek Zielu na YouTube</a>.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
